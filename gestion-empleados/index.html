<body>

    <div class="container" ng-controller="EmpleadoController">

        <h3 class="center-align">
            Gestión de Empleados
        </h3>

        <p class="center-align grey-text">
            Registro y administración de empleados
        </p>

        <!-- Mensaje de error -->
        <div
            class="card-panel red lighten-2 white-text"
            ng-if="mensaje"
        >
            {{ mensaje }}
        </div>

        <!-- Tabla de empleados -->
        <div class="card">

            <div class="card-content">

                <span class="card-title">
                    Lista de empleados
                </span>

                <table class="striped responsive-table">

                    <thead>
                        <tr>
                            <th>Nombre</th>
                            <th>Cargo</th>
                            <th>Oficina</th>
                            <th>Salario</th>
                        </tr>
                    </thead>

                    <tbody>

                        <tr ng-repeat="empleado in empleados">

                            <td>
                                {{ empleado.name }}
                            </td>

                            <td>
                                {{ empleado.position }}
                            </td>

                            <td>
                                {{ empleado.office }}
                            </td>

                            <td>
                                ${{ empleado.salary }}
                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>


    <!-- AngularJS -->
    <script
        src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js">
    </script>

    <!-- Materialize JS -->
    <script
        src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js">
    </script>

    <!-- Nuestra aplicación -->
    <script src="js/app.js"></script>

</body>
